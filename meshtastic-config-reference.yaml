# =============================================================================
# ПОЛНАЯ КОНФИГУРАЦИЯ MESHTASTIC v2.7.15 — СПРАВОЧНЫЙ YAML
# =============================================================================
# Источник: protobuf-определения meshtastic/protobufs v2.7.15
#           (config.proto, module_config.proto, channel.proto, device_ui.proto)
#
# Применение:
#   meshtastic --configure meshtastic-config-reference.yaml
#
# Правила ключей YAML:
#   - Все ключи в camelCase (protobuf snake_case → YAML camelCase)
#   - Конвертация: snake_to_camel() из Python-библиотеки meshtastic
#     Пример: gps_update_interval → gpsUpdateInterval
#   - Удаляйте строки с дефолтными значениями, которые не хотите менять
#   - Meshtastic применяет только явно указанные настройки
#
# ⚠️ ВАЖНО: Включение WiFi отключает Bluetooth! Только один метод подключения одновременно.
# ⚠️ ВАЖНО: Прошивка 2.7.15 — поля, помеченные [deprecated], не использовать.
# =============================================================================


# =============================================================================
# КОРНЕВЫЕ ПОЛЯ (не входят в config / module_config)
# =============================================================================

# Длинное имя узла (отображается в списке узлов, max 40 символов)
owner: ""

# Короткое имя узла (отображается на OLED-экране, max 4 символа для Python API)
# ⚠️ Python-библиотека meshtastic 2.7.x обрезает до 4 символов (не 5!)
owner_short: ""

# URL канала для быстрой настройки (альтернатива ручной настройке каналов)
# Формат: https://www.meshtastic.org/e/#...
# Если указан — перезапишет настройки каналов ниже
channel_url: ""

# Предустановленные сообщения (pipe-separated, для Canned Message модуля)
# Пример: "Привет|Да|Нет|ОК|На связи"
canned_messages: ""

# Мелодия уведомлений в формате RTTTL (Nokia Ringtone)
# Пример: "24:d=32,o=5,b=565:f6,p,f6,4p,p,f6,p,f6,2p"
ringtone: ""

# Фиксированное местоположение (для устройств без GPS или стационарных узлов)
# Используется при position.fixedPosition=true
location:
  lat: 0.0                   # Широта (градусы, float)
  lon: 0.0                   # Долгота (градусы, float)
  alt: 0                     # Высота над уровнем моря (метры, int)


# =============================================================================
# ОСНОВНАЯ КОНФИГУРАЦИЯ (Config protobuf)
# =============================================================================
config:

  # ===========================================================================
  # BLUETOOTH — Config.BluetoothConfig
  # Настройки Bluetooth-подключения для связи с телефоном/компьютером
  # ===========================================================================
  bluetooth:
    # Включить Bluetooth на устройстве
    # Дефолт: true (на T-Echo BT включён по умолчанию)
    # ⚠️ Включение WiFi отключает Bluetooth!
    enabled: true

    # Режим сопряжения Bluetooth
    #   RANDOM_PIN = 0  — устройство генерирует случайный PIN и показывает на экране (ДЕФОЛТ)
    #   FIXED_PIN  = 1  — используется фиксированный PIN из поля fixedPin
    #   NO_PIN     = 2  — сопряжение без PIN (небезопасно!)
    mode: RANDOM_PIN

    # Фиксированный PIN для сопряжения (только при mode=FIXED_PIN)
    # 6 цифр, например 123456
    fixedPin: 123456

  # ===========================================================================
  # DEVICE — Config.DeviceConfig
  # Основные настройки роли и поведения устройства в mesh-сети
  # ===========================================================================
  device:
    # Роль узла в mesh-сети — ОПРЕДЕЛЯЕТ ВСЁ ПОВЕДЕНИЕ УСТРОЙСТВА
    #   CLIENT        = 0  — Обычное устройство с приложением (ДЕФОЛТ)
    #   CLIENT_MUTE   = 1  — Не ретранслирует чужие пакеты (экономит эфир)
    #   ROUTER        = 2  — Инфраструктурный узел, всегда бодрствует, видимый
    #   ROUTER_CLIENT = 3  — [DEPRECATED v2.3.15] Комбо ROUTER+CLIENT
    #   REPEATER      = 4  — [DEPRECATED v2.7.11] Создаёт «дыры» в mesh
    #   TRACKER       = 5  — Приоритет позиции, спит между вещаниями
    #   SENSOR        = 6  — Приоритет телеметрии среды, спит между вещаниями
    #   TAK           = 7  — Оптимизирован для ATAK EUD, минимум вещания
    #   CLIENT_HIDDEN = 8  — «Молчаливый» клиент, минимум вещания, local rebroadcast
    #   LOST_AND_FOUND= 9  — Шлёт текст с координатами для поиска устройства
    #   TAK_TRACKER   = 10 — Авто PLI + минимум вещания
    #   ROUTER_LATE   = 11 — Ретранслирует ПОСЛЕ всех остальных роутеров
    #   CLIENT_BASE   = 12 — Избранные узлы как ROUTER, остальные как CLIENT
    role: CLIENT

    # GPIO пин кнопки пользователя (0 = использовать дефолт платы)
    # T-Echo: дефолтная кнопка уже назначена
    buttonGpio: 0

    # GPIO пин зуммера/PWM (0 = использовать дефолт платы)
    # T-Echo: нет встроенного зуммера
    buzzerGpio: 0

    # Режим ретрансляции пакетов от других узлов
    #   ALL                = 0 — Ретранслировать всё (ДЕФОЛТ)
    #   ALL_SKIP_DECODING  = 1 — Ретрансляция без декодирования (только REPEATER)
    #   LOCAL_ONLY         = 2 — Только свои каналы, игнорировать чужие mesh
    #   KNOWN_ONLY         = 3 — Только от известных узлов (в NodeDB)
    #   NONE               = 4 — Не ретранслировать (только SENSOR/TRACKER/TAK_TRACKER)
    #   CORE_PORTNUMS_ONLY = 5 — Только стандартные типы пакетов (NodeInfo, Text, Position, Telemetry, Routing)
    rebroadcastMode: ALL

    # Интервал рассылки NodeInfo (информация об узле: имя, ключи)
    # В секундах. Дефолт: 900 (15 минут)
    # ⚠️ Слишком частая рассылка расходует эфир!
    nodeInfoBroadcastSecs: 900

    # Двойной тап акселерометра = нажатие кнопки
    # Работает только на платах с акселерометром
    # T-Echo: есть акселерометр BMA421
    doubleTapAsButtonPress: false

    # Отключить тройной клик кнопки для вкл/выкл GPS
    # true = нельзя переключить GPS тройным кликом
    disableTripleClick: false

    # Часовой пояс в формате POSIX
    # Формат: STDoffset[DST[offset][,start[/time],end[/time]]]
    # Примеры:
    #   "MSK-3"              — Москва (нет перехода на летнее время)
    #   "MSK-3MSD,M3.5.0,M10.5.0/3" — Москва с переходом (устаревший)
    #   "UTC0"               — UTC без смещения
    #   "EST5EDT,M3.2.0,M11.1.0" — Восточное время США
    # Источник: https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv
    tzdef: ""

    # Отключить мигание встроенного LED (LED_PIN) — «heartbeat» индикатор
    # true = LED не мигает (экономит немного энергии)
    ledHeartbeatDisabled: false

    # Режим зуммера для звуковой обратной связи
    #   ALL_ENABLED       = 0 — Все звуки: кнопки + уведомления (ДЕФОЛТ)
    #   DISABLED          = 1 — Полностью отключить зуммер
    #   NOTIFICATIONS_ONLY= 2 — Только уведомления/оповещения (не кнопки)
    #   SYSTEM_ONLY       = 3 — Только системные звуки (кнопки, старт, стоп), не оповещения
    #   DIRECT_MSG_ONLY   = 4 — Только личные сообщения + оповещения
    buzzerMode: ALL_ENABLED

  # ===========================================================================
  # DISPLAY — Config.DisplayConfig
  # Настройки OLED/TFT экрана устройства
  # ===========================================================================
  display:
    # Время активности экрана после нажатия кнопки или получения сообщения
    # В секундах. 0 = дефолт (60 сек), MAXUINT = всегда включён
    # ⚠️ Большое значение расходует батарею!
    screenOnSecs: 60

    # Автоперелистывание страниц экрана (карусель)
    # В секундах между переключениями. 0 = отключено (ДЕФОЛТ)
    # Полезно для устройств без кнопок
    autoScreenCarouselSecs: 0

    # Перевернуть экран вверх ногами (180°)
    # Для случаев, когда экран установлен «вверх тормашками»
    flipScreen: false

    # Система единиц для отображения на экране
    #   METRIC   = 0 — Метрическая: °C, км, м (ДЕФОЛТ)
    #   IMPERIAL = 1 — Имперская: °F, мили, футы
    units: METRIC

    # Тип OLED-дисплея (переопределение автоопределения)
    #   OLED_AUTO          = 0 — Автоопределение (ДЕФОЛТ)
    #   OLED_SSD1306       = 1 — SSD1306 (128x64)
    #   OLED_SH1106        = 2 — SH1106 (128x64)
    #   OLED_SH1107        = 3 — SH1107 (128x64, для некоторых T-Echo)
    #   OLED_SH1107_128_128= 4 — SH1107 (128x128)
    # T-Echo использует SH1107 128x64
    oled: OLED_AUTO

    # Режим отображения на OLED
    #   DEFAULT  = 0 — Стандартный 128x64 (ДЕФОЛТ)
    #   TWOCOLOR = 1 — Для двухцветных OLED (жёлтый верх + синий низ)
    #   INVERTED = 2 — Как TWOCOLOR, но инвертированная верхняя панель
    #   COLOR    = 3 — TFT Full Color (пока не реализовано)
    displaymode: DEFAULT

    # Жирный шрифт для первой строки (заголовка) на экране
    # false = оригинальный стиль, true = жирный
    headingBold: false

    # Пробуждение экрана при обнаружении движения/тапа акселерометром
    # Работает только на платах с акселерометром
    # T-Echo: есть BMA421
    wakeOnTapOrMotion: false

    # Ориентация компаса на экране (как отображать направление)
    #   DEGREES_0           = 0 — Без вращения (компас и экран в одной ориентации)
    #   DEGREES_90          = 1 — Повернуть на 90°
    #   DEGREES_180         = 2 — Повернуть на 180°
    #   DEGREES_270         = 3 — Повернуть на 270°
    #   DEGREES_0_INVERTED  = 4 — Без вращения, но инвертировать
    #   DEGREES_90_INVERTED = 5 — 90° + инверсия
    #   DEGREES_180_INVERTED= 6 — 180° + инверсия
    #   DEGREES_270_INVERTED= 7 — 270° + инверсия
    compassOrientation: DEGREES_0

    # Формат времени на экране
    # false = 24-часовой формат (ДЕФОЛТ, как в России)
    # true  = 12-часовой формат (AM/PM)
    use12hClock: false

    # Отображать полные имена узлов на экране
    # false = короткие имена (ДЕФОЛТ, экономит место на маленьком экране)
    # true  = полные имена
    useLongNodeName: false

  # ===========================================================================
  # LORA — Config.LoRaConfig
  # Настройки LoRa-радио: частота, модуляция, мощность, каналы
  # ===========================================================================
  lora:
    # Использовать предустановку модема (true) или ручные параметры (false)
    # При true — поле modemPreset определяет bandwidth/spreadFactor/codingRate
    # При false — используются поля bandwidth/spreadFactor/codingRate ниже
    usePreset: true

    # Предустановка модема — определяет дальность и скорость связи
    #   LONG_FAST     = 0 — Дальний, быстрый (ДЕФОЛТ)
    #   LONG_SLOW     = 1 — Дальний, медленный (максимальная дальность)
    #   VERY_LONG_SLOW= 2 — [DEPRECATED v2.5] Неработоспособно медленно
    #   MEDIUM_SLOW   = 3 — Средний, медленный
    #   MEDIUM_FAST   = 4 — Средний, быстрый
    #   SHORT_SLOW    = 5 — Короткий, медленный
    #   SHORT_FAST    = 6 — Короткий, быстрый
    #   LONG_MODERATE  = 7 — Дальний, умеренный ★ РЕКОМЕНДУЕТСЯ ДЛЯ ЛЕСА
    #   SHORT_TURBO   = 8 — Короткий, турбо (500kHz, не легален везде)
    # ⚠️ ВСЕ узлы в сети ДОЛЖНЫ использовать одинаковый пресет!
    modemPreset: LONG_FAST

    # Полоса пропускания в МГц (только при usePreset=false)
    # Специальные значения: 31 → 31.25 МГц
    # Типичные: 0.125, 0.25, 0.5
    bandwidth: 0

    # Спрединг-фактор (SF) — выше = дальность, ниже = скорость
    # Диапазон: 7-12 (только при usePreset=false)
    spreadFactor: 0

    # Кодовая скорость (CR) — выше = коррекция ошибок, ниже = скорость
    # Диапазон: 5-8 (только при usePreset=false)
    # 5=4/5, 6=4/6, 7=4/7, 8=4/8
    codingRate: 0

    # Лимит хопов (прыжков между узлами)
    # Пакет не пройдёт больше этого количества ретрансляций
    # Дефолт: 3 (для города достаточно, для леса — МАЛО)
    # ⚠️ Рекомендация для леса: 5-7
    # ⚠️ Каждый дополнительный хоп увеличивает задержку и загрузку эфира
    hopLimit: 3

    # Разрешить передачу через LoRa-радио
    # false = «тихий» режим (полезно для тестов, горячей замены антенны)
    txEnabled: true

    # Мощность передачи в dBm
    # 0 = использовать максимум, разрешённый в регионе (ДЕФОЛТ)
    # Для EU_433: максимум 27 dBm (500 мВт)
    # ⚠️ Не ставьте больше разрешённого — незаконно + может сжечь радио!
    txPower: 0

    # Номер канала (частота внутри диапазона региона)
    # 0 = автоматически по хешу имени канала (ДЕФОЛТ)
    # Конкретное число = фиксированный канал (1 до NUM_CHANNELS региона)
    channelNum: 0

    # Игнорировать ограничения duty cycle (процент времени передачи)
    # false = соблюдать региональные ограничения (ДЕФОЛТ)
    # true = передавать без ограничений (ТОЛЬКО для HAM-лицензий!)
    # ⚠️ Для EU_433 duty cycle 100% — этот флаг не имеет эффекта
    overrideDutyCycle: false

    # Усиленный режим приёма на чипах SX126X
    # true = RX boosted gain (лучше чувствительность, больше потребление)
    # T-Echo: использует SX1262 — этот параметр применим
    sx126xRxBoostedGain: false

    # Переопределение частоты в MHz (для HAM / вне стандартных диапазонов)
    # 0.0 = использовать стандартную частоту региона (ДЕФОЛТ)
    # ⚠️ Только для лицензированных HAM-операторов! Уважайте местные законы!
    # ⚠️ frequency_offset всё равно применяется
    overrideFrequency: 0.0

    # Отключить вентилятор PA (PA_FAN) на платах, где он есть
    # T-Echo: нет вентилятора — не применимо
    paFanDisabled: false

    # Список nodenum для игнорирования входящих пакетов
    # Пакеты от этих узлов будут отброшены на приёме (для тестирования)
    # Формат: список целых чисел
    # Пример: [12345678, 87654321]
    ignoreIncoming: []

    # Игнорировать LoRa-пакеты, прошедшие через MQTT на любом участке пути
    # true = пакеты с MQTT-историей отбрасываются (ДЕФОЛТ: false)
    ignoreMqtt: false

    # Установить флаг ok_to_mqtt на исходящих пакетах
    # true = другие узлы могут пересылать этот пакет через MQTT
    # false = пакет не должен уходить в MQTT (ДЕФОЛТ)
    configOkToMqtt: false

  # ===========================================================================
  # NETWORK — Config.NetworkConfig
  # Настройки WiFi/Ethernet/IP для подключения к интернету
  # ===========================================================================
  network:
    # Включить WiFi-подключение
    # ⚠️ ВКЛЮЧЕНИЕ WiFi ОТКЛЮЧАЕТ BLUETOOTH! Только один метод одновременно!
    # Дефолт: false
    wifiEnabled: false

    # SSID (имя) WiFi-сети
    # Чувствительно к регистру! Max 32 символа
    wifiSsid: ""

    # Пароль WiFi-сети
    # Чувствительно к регистру! Max 64 символа
    wifiPsk: ""

    # NTP-сервер для синхронизации времени через WiFi/Ethernet
    # Дефолт: "meshtastic.pool.ntp.org"
    ntpServer: "meshtastic.pool.ntp.org"

    # Включить Ethernet-подключение (если плата поддерживает)
    # T-Echo: нет Ethernet — не применимо
    ethEnabled: false

    # Режим получения IP-адреса
    #   DHCP   = 0 — Автоматически через DHCP (ДЕФОЛТ)
    #   STATIC = 1 — Статический IP из ipv4Config
    addressMode: DHCP

    # Статическая IPv4-конфигурация (только при addressMode=STATIC)
    # Все поля — 32-битные целые (fixed32 в protobuf)
    # Обычно задаются в десятичном формате IP → uint32
    ipv4Config:
      ip: 0                    # IP-адрес (напр. 192.168.1.100 → 3232235876)
      gateway: 0               # Шлюз (напр. 192.168.1.1 → 3232235777)
      subnet: 0                # Маска (напр. 255.255.255.0 → 4294967040)
      dns: 0                   # DNS-сервер (напр. 8.8.8.8 → 134744072)

    # Rsyslog-сервер и порт для удалённого логирования
    # Формат: "host:port" (напр. "192.168.1.10:514")
    rsyslogServer: ""

    # Битовые флаги вспомогательных сетевых протоколов
    #   NO_BROADCAST  = 0x0000 — Не вещать пакеты через сетевые протоколы
    #   UDP_BROADCAST = 0x0001 — Вещать пакеты через UDP в локальную сеть
    # Дефолт: 1 (UDP_BROADCAST включён)
    enabledProtocols: 1

    # Включить IPv6 (экспериментально)
    ipv6Enabled: false

  # ===========================================================================
  # POSITION — Config.PositionConfig
  # Настройки GPS и рассылки позиции в mesh-сеть
  # ===========================================================================
  position:
    # Интервал рассылки позиции в mesh (в секундах)
    # Дефолт: 900 (15 минут)
    # ⚠️ При smart broadcast = true — это МАКСИМАЛЬНЫЙ интервал,
    #    позиция шлётся раньше при значительном перемещении
    # ⚠️ Для TRACKER-роли: используется как интервал при пробуждении
    positionBroadcastSecs: 900

    # Умная рассылка позиции (Adaptive Position Broadcast)
    # true = шлёт позицию только при значительном изменении (ДЕФОЛТ)
    #        Экономит эфир и батарею!
    # false = шлёт позицию через равные интервалы (positionBroadcastSecs)
    positionBroadcastSmartEnabled: true

    # Фиксированная позиция — устройство использует последнюю известную
    # позицию без обновления от GPS
    # Для стационарных устройств: базовая станция, трекер в лагере
    # ⚠️ БАГ #8403: при gps_mode=ENABLED, onGPSChanged перезаписывает fixed_position!
    #    → При fixedPosition=true ОБЯЗАТЕЛЬНО ставить gps_mode=DISABLED
    # ⚠️ БАГ #7478: при position_precision < 32 координаты округляются и повреждяются
    #    → При fixedPosition=true ОБЯЗАТЕЛЬНО position_precision=32 на канале
    fixedPosition: false

    # Интервал опроса GPS-модуля (в секундах)
    # 0 = дефолт (120 сек для T-Echo с L76K)
    # Конкретное число = интервал в секундах
    # MAX_UINT32 = обновить GPS только один раз при загрузке
    # ⚠️ Для T-Echo (L76K GNSS): минимум 30 сек! Меньше — неточный фикс.
    # ⚠️ Дефолт прошивки 120 сек даёт лучшее качество.
    gpsUpdateInterval: 30

    # Битовая маска: какие дополнительные поля включать в POSITION-пакеты
    # Больше полей = длиннее пакет = больше эфирного времени
    #   UNSET              = 0x0000 — Обязательное для компиляции
    #   ALTITUDE           = 0x0001 — Высота над уровнем моря
    #   ALTITUDE_MSL       = 0x0002 — Высота MSL (Mean Sea Level)
    #   GEOIDAL_SEPARATION = 0x0004 — Геоидальное отделение
    #   DOP                = 0x0008 — Точность (PDOP по умолчанию)
    #   HVDOP              = 0x0010 — Отдельно HDOP/VDOP вместо PDOP
    #   SATINVIEW          = 0x0020 — Кол-во спутников в поле зрения
    #   SEQ_NO             = 0x0040 — Порядковый номер пакета
    #   TIMESTAMP          = 0x0080 — Временная метка GPS
    #   HEADING            = 0x0100 — Курс (градусы), для ТРАНСПОРТА
    #   SPEED              = 0x0200 — Скорость, для ТРАНСПОРТА
    # Дефолт прошивки: 811 = ALT+MSL+DOP+SAT+HEADING+SPEED
    # Наш дефолт (пеший): 299 = ALT+MSL+DOP+SAT+HEADING (без SPEED)
    # Все флаги: 1023
    # ⚠️ HEADING/SPEED ненадёжны пешком — только для транспорта!
    positionFlags: 299

    # GPIO пин для GPS RX (переопределение дефолта платы)
    # 0 = использовать дефолт платы (T-Echo: уже назначен)
    rxGpio: 0

    # GPIO пин для GPS TX (переопределение дефолта платы)
    # 0 = использовать дефолт платы
    txGpio: 0

    # Минимальное расстояние (метры) для smart broadcast
    # Позиция отправится только если перемещение > этого значения
    # Дефолт прошивки: 0 (= 100м)
    # ⚠️ Слишком малое значение (20м) = ложные вещания из-за шума GPS
    broadcastSmartMinimumDistance: 100

    # Минимальный интервал (секунды) для smart broadcast
    # Даже если перемещение > distance, не отправлять чаще этого интервала
    # Дефолт прошивки: 0 (= 900 сек = 15 мин)
    broadcastSmartMinimumIntervalSecs: 300

    # GPIO пин для GPS EN (включение/выключение GPS-модуля)
    # 0 = использовать дефолт платы (T-Echo: уже назначен)
    gpsEnGpio: 0

    # Режим GPS-модуля
    #   DISABLED    = 0 — GPS присутствует, но отключён
    #   ENABLED     = 1 — GPS включён и работает (ДЕФОЛТ)
    #   NOT_PRESENT = 2 — GPS-модуля нет на устройстве
    # ⚠️ При fixedPosition=true ОБЯЗАТЕЛЬНО ставить DISABLED (баг #8403)!
    gpsMode: ENABLED

  # ===========================================================================
  # POWER — Config.PowerConfig
  # Настройки питания, сна и батареи
  # ===========================================================================
  power:
    # Режим энергосбережения (Power Saving Mode)
    # true = устройство максимально спит, просыпается только для вещания
    #        Для TRACKER/SENSOR: спит даже LoRa-радио между вещаниями
    # ⚠️ НЕ использовать, если нужно подключение через телефон/приложение!
    # ⚠️ НЕ использовать на устройствах без кнопки пользователя!
    # Работает на ESP32 и nRF52 (T-Echo) в ролях SENSOR/TRACKER
    isPowerSaving: false

    # Выключить устройство через N секунд после отключения внешнего питания
    # 0 = никогда не выключать (ДЕФОЛТ)
    # Конкретное число = таймер в секундах
    # Полезно для устройств на солнечных панелях: выключиться ночью
    onBatteryShutdownAfterSecs: 0

    # Множитель АЦП для расчёта напряжения батареи
    # Переопределяет ADC_MULTIPLIER, заданный в variant платы
    # Диапазон: 2.0 - 6.0 (float)
    # 0.0 = использовать дефолт платы (ДЕФОЛТ)
    # Формула: voltage = adc_reading × ADC_MULTIPLIER
    # Пример: 3.20 для R1=100k, R2=220k
    # Подробнее: https://meshtastic.org/docs/configuration/radio/power/#adc-multiplier-override
    adcMultiplierOverride: 0.0

    # Время ожидания Bluetooth перед отключением (в секундах)
    # Только ESP32! На nRF52 (T-Echo) не используется.
    # Дефолт: 60 сек
    waitBluetoothSecs: 60

    # Super Deep Sleep (SDS) — глубокий сон
    # Устройство проснётся только по нажатию кнопки или по истечении этого таймера
    # Дефолт: 4294967295 (~136 лет, фактически никогда)
    # 0 = дефолт (1 год)
    sdsSecs: 4294967295

    # Light Sleep (LS) — лёгкий сон
    # CPU приостановлен, LoRa-радио работает, BLE отключён, GPS работает
    # Только ESP32! На nRF52 (T-Echo) не используется.
    # Дефолт: 300 сек (5 минут)
    lsSecs: 300

    # Минимальное время пробуждения после получения LoRa-пакета
    # Только ESP32! На nRF52 (T-Echo) не используется.
    # Дефолт: 10 сек
    minWakeSecs: 10

    # I2C-адрес чипа INA_2XX для точного измерения батареи
    # 0 = не использовать INA_2XX (ДЕФОЛТ)
    # Если на плате установлен INA219/INA226 — указать адрес (напр. 0x40)
    deviceBatteryInaAddress: 0

    # Битовые флаги включения powermon-логирования
    # 0 = отключено (ДЕФОЛТ)
    # Для отладки потребления энергии
    powermonEnables: 0

  # ===========================================================================
  # SECURITY — Config.SecurityConfig
  # Настройки безопасности: ключи, доступ, администрирование
  # ===========================================================================
  security:
    # Публичный ключ устройства (bytes, hex-строка)
    # Генерируется автоматически при первом запуске
    # НЕ МЕНЯТЬ вручную без крайней необходимости!
    publicKey: ""

    # Приватный ключ устройства (bytes, hex-строка)
    # ⚠️ НИКОГДА не передавать по сети! Только через кабель!
    privateKey: ""

    # Публичные ключи администратора (список hex-строк)
    # Узлы с этими ключами могут отправлять admin-команды
    # По умолчанию — публичный ключ текущего устройства
    adminKey: []

    # Управляемый узел (Managed Mode)
    # true = узел управляется администратором mesh, ограниченный UI
    # Клиентские приложения скрывают расширенные настройки
    isManaged: false

    # Включить Serial Console через Stream API
    # true = можно управлять устройством через USB-serial (ДЕФОЛТ)
    # false = serial отключён (безопаснее, но неудобнее)
    # ⚠️ Ранее было в DeviceConfig, перенесено в SecurityConfig в 2.7.x
    serialEnabled: true

    # Отладочный лог через Serial/Bluetooth API
    # true = живой debug-вывод через serial/BT
    # false = лог отключается при подключении клиента (ДЕФОЛТ)
    debugLogApiEnabled: false

    # Разрешить входящие admin-команды через небезопасный admin-канал
    # true = ЛЮБОЙ узел может отправлять admin-команды! ОПАСНО!
    # false = admin только через защищённый канал (ДЕФОЛТ)
    # ⚠️ Включайте только если понимаете последствия!
    adminChannelEnabled: false

  # ===========================================================================
  # DEVICE_UI — Config.DeviceUIConfig
  # Настройки TFT/BaseUI (прошивка 2.7+, только для устройств с TFT-экраном)
  # ⚠️ T-Echo использует OLED, НЕ TFT — большинство этих настроек НЕ ПРИМЕНИМО!
  # Оставлено для справки при использовании других устройств (T-Deck, T-Watch)
  # ===========================================================================
  device_ui:
    # Версия конфигурации UI (для инвалидации кэша при несовместимых изменениях)
    version: 0

    # Яркость TFT-экрана (1-255)
    screenBrightness: 255

    # Таймаут экрана TFT (0-900 секунд)
    screenTimeout: 60

    # Блокировка экрана (требует PIN для разблокировки)
    screenLock: false

    # Блокировка настроек (требует PIN для изменения настроек)
    settingsLock: false

    # PIN-код для блокировки (4-8 цифр)
    pinCode: 0

    # Цветовая тема TFT
    #   DARK  = 0 — Тёмная тема (ДЕФОЛТ)
    #   LIGHT = 1 — Светлая тема
    #   RED   = 2 — Красная тема
    theme: DARK

    # Звуковые оповещения (TFT-устройства)
    alertEnabled: true

    # Баннер уведомлений на TFT
    bannerEnabled: true

    # ID мелодии рингтона (предустановленные)
    ringToneId: 0

    # Язык интерфейса TFT
    #   ENGLISH=0, FRENCH=1, GERMAN=2, ITALIAN=3, PORTUGUESE=4,
    #   SPANISH=5, SWEDISH=6, FINNISH=7, POLISH=8, TURKISH=9,
    #   SERBIAN=10, и другие...
    language: ENGLISH

    # Фильтр списка узлов на TFT-экране
    nodeFilter:
      unknownSwitch: false     # Скрыть неизвестные узлы
      offlineSwitch: false     # Скрыть офлайн-узлы
      publicKeySwitch: false   # Скрыть узлы без публичного ключа
      hopsAway: -1             # Фильтр по кол-ву хопов (-1 = все)
      positionSwitch: false    # Скрыть узлы без позиции
      nodeName: ""             # Фильтр по имени (подстрока)
      channel: -1              # Фильтр по каналу (-1 = все)

    # Подсветка узлов на TFT-экране
    nodeHighlight:
      chatSwitch: false        # Подсветить с активным чатом
      positionSwitch: false    # Подсветить с позицией
      telemetrySwitch: false   # Подсветить с телеметрией
      iaqSwitch: false         # Подсветить с IAQ-данными
      nodeName: ""             # Подсветить по имени

    # Данные калибровки тачскрина (bytes, hex)
    calibrationData: ""

    # Настройки карты на TFT
    mapData:
      home:                    # Домашние координаты
        zoom: 12               # Уровень масштаба
        latitude: 0            # Широта
        longitude: 0           # Долгота
      style: ""                # Стиль тайлов карты
      followGps: false         # Карта следует за GPS

    # Режим компаса на TFT
    #   DYNAMIC       = 0 — Динамическое кольцо + курс (ДЕФОЛТ)
    #   FIXED_RING    = 1 — Фиксированное кольцо + курс
    #   FREEZE_HEADING= 2 — Курс с фиксацией
    compassMode: DYNAMIC

    # RGB-цвет подсветки BaseUI (0xRRGGBB формат)
    # Пример: 0xFF0000 = красный
    screenRgbColor: 0

    # Стиль часов: аналоговые (true) или цифровые (false)
    isClockfaceAnalog: false

    # Формат координат GPS на экране
    #   DEC  = 0 — Десятичные градусы: DD.DDDDDD (ДЕФОЛТ)
    #   DMS  = 1 — Градусы/минуты/секунды: DD°MM'SS"C
    #   UTM  = 2 — Universal Transverse Mercator: ZZB EEEEEE NNNNNNN
    #   MGRS = 3 — Military Grid Reference System
    #   OLC  = 4 — Open Location Code (Plus Codes)
    #   OSGR = 5 — Ordnance Survey Grid Reference (UK)
    #   MLS  = 6 — Maidenhead Locator System
    gpsFormat: DEC


# =============================================================================
# КОНФИГУРАЦИЯ МОДУЛЕЙ (ModuleConfig protobuf)
# =============================================================================
module_config:

  # ===========================================================================
  # MQTT — ModuleConfig.MQTTConfig
  # Настройки MQTT-шлюза для связи mesh-сети с интернетом
  # ⚠️ Мы НЕ используем MQTT в этом проекте! Оставлено для справки.
  # ===========================================================================
  mqtt:
    # Включить MQTT-клиент
    # true = устройство подключается к MQTT-брокеру через WiFi/Ethernet
    # false = MQTT отключён (ДЕФОЛТ, наш случай)
    enabled: false

    # Адрес MQTT-брокера
    # Пустая строка = дефолтный сервер (mqtt.meshtastic.org)
    # Для своего сервера: "mqtt.example.com" или "192.168.1.10:1883"
    address: ""

    # Имя пользователя MQTT
    # Для дефолтного сервера: оставить пустым (используется дефолтный)
    # Для своего сервера: логин от MQTT-брокера
    username: ""

    # Пароль MQTT
    # Для дефолтного сервера: оставить пустым
    # Для своего сервера: пароль от MQTT-брокера
    password: ""

    # Шифровать пакеты перед отправкой в MQTT
    # true = пакеты зашифрованы (ДЕФОЛТ, безопасно)
    # false = пакеты расшифрованы (удобно для внешних систем-потребителей)
    # ⚠️ Расшифровка работает только со своим сервером!
    encryptionEnabled: true

    # Отправлять/принимать JSON-формат в MQTT
    # true = человекочитаемый JSON в топиках (удобно для интеграции)
    # false = бинарный protobuf (ДЕФОЛТ, компактнее)
    jsonEnabled: false

    # Использовать TLS (SSL) для MQTT-подключения
    # true = шифрованное соединение (порт 8883)
    # false = без шифрования (порт 1883, ДЕФОЛТ)
    tlsEnabled: false

    # Корневой топик MQTT
    # Дефолт: "msh"
    # Полный топик: {root}/{region}/{channel}
    # Полезно для разделения сетей на одном брокере через ACL
    root: "msh"

    # Проксировать MQTT через подключённый телефон/клиент
    # true = если нет WiFi, использовать интернет-подключение телефона
    # false = MQTT только при прямом подключении к интернету (ДЕФОЛТ)
    proxyToClientEnabled: false

    # Отправлять информацию об узле на публичную карту через MQTT
    # true = периодически отправлять незашифрованную инфо (позиция, имя)
    # false = не отправлять на карту (ДЕФОЛТ)
    mapReportingEnabled: false

    # Настройки отправки информации на карту (если mapReportingEnabled=true)
    mapReportSettings:
      # Интервал отправки на карту в секундах
      publishIntervalSecs: 900

      # Точность позиции для карты (бит)
      # 32 = полная точность (~1м), 13 = ~2.9км (ДЕФОЛТ: 32)
      positionPrecision: 32

      # Отправлять ли координаты на карту
      # false = только метаданные без позиции (ДЕФОЛТ)
      shouldReportLocation: false

  # ===========================================================================
  # SERIAL — ModuleConfig.SerialConfig
  # Настройки Serial-модуля для ввода/вывода через UART
  # ===========================================================================
  serial:
    # Включить Serial-модуль
    # true = активировать дополнительные serial-функции (NMEA, CalTopo и др.)
    # false = только стандартный Stream API (ДЕФОЛТ)
    serialEnabled: false

    # Эхо в serial (возвращать отправленные данные)
    echo: false

    # RX пин serial (0 = дефолт платы)
    rxd: 0

    # TX пин serial (0 = дефолт платы)
    txd: 0

    # Скорость serial-порта
    #   BAUD_DEFAULT = 0  — Авто (ДЕФОЛТ)
    #   BAUD_110     = 1  — 110 бод
    #   BAUD_300     = 2  — 300 бод
    #   BAUD_600     = 3  — 600 бод
    #   BAUD_1200    = 4  — 1200 бод
    #   BAUD_2400    = 5  — 2400 бод
    #   BAUD_4800    = 6  — 4800 бод
    #   BAUD_9600    = 7  — 9600 бод
    #   BAUD_19200   = 8  — 19200 бод
    #   BAUD_38400   = 9  — 38400 бод
    #   BAUD_57600   = 10 — 57600 бод
    #   BAUD_115200  = 11 — 115200 бод ★ ТИПИЧНО ДЛЯ T-ECHO
    #   BAUD_230400  = 12 — 230400 бод
    #   BAUD_460800  = 13 — 460800 бод
    #   BAUD_576000  = 14 — 576000 бод
    #   BAUD_921600  = 15 — 921600 бод
    baud: BAUD_DEFAULT

    # Таймаут serial-операций в миллисекундах
    timeout: 0

    # Режим работы Serial-модуля
    #   DEFAULT   = 0 — Стандартный протокол Meshtastic (ДЕФОЛТ)
    #   SIMPLE    = 1 — Простой текстовый ввод/вывод
    #   PROTO     = 2 — Protobuf-протокол
    #   TEXTMSG   = 3 — Прямая отправка текстовых сообщений в mesh
    #   NMEA      = 4 — Вывод NMEA-предложений (GPS → внешнее устройство)
    #   CALTOPO   = 5 — NMEA для CalTopo (специфичный формат)
    #   WS85      = 6 — Ecowitt WS85 метеостанция (Serial → mesh)
    #   VE_DIRECT = 7 — Victron Energy VE.Direct (солнечные контроллеры)
    #   MS_CONFIG = 8 — MeshSolar конфигурация
    mode: DEFAULT

    # Переопределить платформенный Serial-порт для Serial-модуля
    # true = Serial-модуль использует порт, заданный rxd/txd
    #        Существующий лог через Serial Console сохраняется
    # Работает надёжно только в выходных режимах (NMEA, CalTopo)
    overrideConsoleSerialPort: false

  # ===========================================================================
  # EXTERNAL NOTIFICATION — ModuleConfig.ExternalNotificationConfig
  # Настройки внешних уведомлений: LED, вибро, зуммер
  # ===========================================================================
  external_notification:
    # Включить модуль внешних уведомлений
    enabled: false

    # Длительность выходного сигнала в миллисекундах
    # Дефолт: 1000 (1 секунда)
    outputMs: 1000

    # GPIO пин выходного сигнала (LED/реле)
    # 0 = использовать EXT_NOTIFY_OUT платы (если определён)
    output: 0

    # GPIO пин вибромотора (опционально)
    outputVibra: 0

    # GPIO пин активного зуммера (опционально)
    outputBuzzer: 0

    # Полярность выходного сигнала
    # true  = Active HIGH (высокий уровень = вкл) — реле, LED с общим катодом
    # false = Active LOW (низкий уровень = вкл) — ДЕФОЛТ
    active: false

    # Сигнал при входящем текстовом сообщении (выход output)
    alertMessage: false

    # Сигнал при входящем текстовом сообщении (вибромотор)
    alertMessageVibra: false

    # Сигнал при входящем текстовом сообщении (зуммер)
    alertMessageBuzzer: false

    # Сигнал при получении bell-символа (ASCII 0x07) (выход output)
    # Bell-символ используется Canned Message и Detection Sensor модулями
    alertBell: false

    # Сигнал при bell-символе (вибромотор)
    alertBellVibra: false

    # Сигнал при bell-символе (зуммер)
    alertBellBuzzer: false

    # Использовать PWM-выход вместо простого on/off
    # true = использовать device.buzzer_gpio как PWM-выход
    #        Игнорирует output, outputMs и active настройки
    usePwm: false

    # Таймаут «доколачивания» (nag) в секундах
    # 0 = не повторять (ДЕФОЛТ)
    # N = повторять сигнал каждые outputMs мс в течение N секунд
    # Пример: 60 = мигать/пищать 60 секунд
    nagTimeout: 0

    # Использовать I2S-аудиовыход как зуммер (RTTTL через динамик)
    # Для устройств с I2S-динамиком: T-Watch S3, T-Deck
    # T-Echo: нет I2S-динамика — не применимо
    useI2sAsBuzzer: false

  # ===========================================================================
  # STORE AND FORWARD — ModuleConfig.StoreForwardConfig
  # Модуль хранения и пересылки сообщений (для роутеров с ESP32)
  # ===========================================================================
  store_forward:
    # Включить модуль Store & Forward
    # Роутер сохраняет сообщения и пересылает по запросу
    enabled: false

    # Отправлять heartbeat-сообщения (информация о сервере хранения)
    heartbeat: false

    # Количество записей для хранения в памяти/флеше
    records: 0

    # Максимальное количество записей в ответе на запрос истории
    historyReturnMax: 0

    # Временное окно истории в секундах
    # Сколько секунд истории пересылать по запросу
    historyReturnWindow: 0

    # Работать как сервер хранения (хранить и пересылать сообщения)
    # false = клиент (запрашивает историю) — ДЕФОЛТ
    # true = сервер (хранит и раздаёт историю)
    # ⚠️ Только для ESP32 (нужно достаточно памяти)!
    isServer: false

  # ===========================================================================
  # RANGE TEST — ModuleConfig.RangeTestConfig
  # Модуль тестирования дальности связи
  # ===========================================================================
  range_test:
    # Включить модуль теста дальности
    enabled: false

    # Интервал отправки тестовых сообщений (в секундах)
    # 0 = не отправлять автоматически
    sender: 0

    # Сохранять результаты в RangeTest.csv на флеше
    # ⚠️ Только ESP32! T-Echo (nRF52) не поддерживает!
    save: false

    # Очищать RangeTest.csv при перезагрузке
    clearOnReboot: false

  # ===========================================================================
  # TELEMETRY — ModuleConfig.TelemetryConfig
  # Настройки телеметрии: устройства, среды, воздуха, питания, здоровья
  # ===========================================================================
  telemetry:
    # --- Телеметрия устройства (батарея, напряжение, загрузка канала) ---

    # Интервал отправки телеметрии устройства в mesh (в секундах)
    # Дефолт: 900 (15 минут)
    deviceUpdateInterval: 900

    # Отправлять ли телеметрию устройства в mesh
    # true = отправлять в mesh + в подключённое приложение (ДЕФОЛТ)
    # false = только в подключённое приложение (каждую минуту по API)
    # ⚠️ Даже при false приложение получает телеметрию по API!
    deviceTelemetryEnabled: true

    # --- Телеметрия среды (температура, влажность, давление) ---

    # Включить измерения среды (нужен BME280/BME680/и т.д.)
    # T-Echo: есть BME280 (температура, влажность, давление) ★
    environmentMeasurementEnabled: false

    # Интервал отправки телеметрии среды (в секундах)
    # Дефолт: 900 (15 минут)
    environmentUpdateInterval: 900

    # Показывать телеметрию среды на экране устройства
    environmentScreenEnabled: false

    # Отображать температуру в Фаренгейтах
    # false = Цельсий (ДЕФОЛТ)
    environmentDisplayFahrenheit: false

    # --- Качество воздуха (IAQ) ---

    # Включить измерение качества воздуха (нужен BME680 с IAQ)
    # T-Echo: BME280 (без IAQ) — не применимо
    airQualityEnabled: false

    # Интервал отправки IAQ-данных (в секундах)
    airQualityInterval: 0

    # --- Измерение питания (мощность, ток) ---

    # Включить измерение питания (нужен INA219/INA226)
    powerMeasurementEnabled: false

    # Интервал отправки телеметрии питания (в секундах)
    powerUpdateInterval: 0

    # Показывать телеметрию питания на экране
    powerScreenEnabled: false

    # --- Телеметрия здоровья (пульс, SpO2) ---

    # Включить датчики здоровья (нужен MAX30101 и подобное)
    # T-Echo: нет датчика здоровья — не применимо
    healthMeasurementEnabled: false

    # Интервал отправки телеметрии здоровья (в секундах)
    healthUpdateInterval: 0

    # Показывать телеметрию здоровья на экране
    healthScreenEnabled: false

  # ===========================================================================
  # CANNED MESSAGE — ModuleConfig.CannedMessageConfig
  # Модуль предустановленных сообщений + энкодер/кнопки ввода
  # ===========================================================================
  canned_message:
    # Включить энкодер #1 (поворотный, «глупый» — импульсы A/B)
    rotary1Enabled: false

    # GPIO пин A энкодера
    inputbrokerPinA: 0

    # GPIO пин B энкодера
    inputbrokerPinB: 0

    # GPIO пин кнопки энкодера (нажатие)
    inputbrokerPinPress: 0

    # Событие при повороте по часовой стрелке (CW)
    #   NONE   = 0  — Нет события
    #   UP     = 17 — Стрелка вверх
    #   DOWN   = 18 — Стрелка вниз
    #   LEFT   = 19 — Стрелка влево
    #   RIGHT  = 20 — Стрелка вправо
    #   SELECT = 10 — Ввод (Enter)
    #   BACK   = 27 — Назад (Escape)
    #   CANCEL = 24 — Отмена
    inputbrokerEventCw: NONE

    # Событие при повороте против часовой (CCW)
    inputbrokerEventCcw: NONE

    # Событие при нажатии кнопки энкодера
    inputbrokerEventPress: NONE

    # Включить Up/Down/Select устройство
    # RAK-энкодер или 3 кнопки (использует pinA/pinB/pinPress)
    updown1Enabled: false

    # Отправлять bell-символ (ASCII 0x07) с предустановленными сообщениями
    # Полезно для External Notification модуля (зуммер/вибро при отправке)
    sendBell: false

  # ===========================================================================
  # AUDIO — ModuleConfig.AudioConfig
  # Настройки голосовой связи (codec2)
  # ⚠️ T-Echo: НЕТ микрофона/динамика для codec2 — не применимо!
  # ===========================================================================
  audio:
    # Включить codec2 голосовую связь
    codec2Enabled: false

    # GPIO пин PTT-кнопки (Push-To-Talk)
    pttPin: 0

    # Битрейт codec2 (качество голоса vs дальность)
    #   CODEC2_DEFAULT = 0 — Дефолтный (700B)
    #   CODEC2_3200    = 1 — Лучшее качество, минимальная дальность
    #   CODEC2_2400    = 2 — Хорошее качество, малая дальность
    #   CODEC2_1600    = 3 — Среднее качество, средняя дальность
    #   CODEC2_1400    = 4 — Приемлемое качество
    #   CODEC2_1300    = 5 — Низкое качество, хорошая дальность
    #   CODEC2_1200    = 6 — Минимальное качество, дальняя связь
    #   CODEC2_700     = 7 — Очень низкое качество, максимальная дальность
    #   CODEC2_700B    = 8 — Ещё ниже качество, максимальная дальность
    bitrate: CODEC2_DEFAULT

    # I2S Word Select (WS) пин — для цифрового аудио
    i2sWs: 0

    # I2S Serial Data (SD) пин — вход аудиоданных
    i2sSd: 0

    # I2S Data IN (DIN) пин — выход аудиоданных
    i2sDin: 0

    # I2S Serial Clock (SCK) пин — тактирование аудио
    i2sSck: 0

  # ===========================================================================
  # REMOTE HARDWARE — ModuleConfig.RemoteHardwareConfig
  # Модуль удалённого управления GPIO-пинами через mesh
  # ===========================================================================
  remote_hardware:
    # Включить модуль Remote Hardware
    # Позволяет другим узлам читать/писать GPIO-пины этого устройства
    enabled: false

    # Разрешить доступ к пинам, не определённым в availablePins
    # ⚠️ true = ЛЮБОЙ узел может управлять ЛЮБЫМ GPIO! ОПАСНО!
    allowUndefinedPinAccess: false

    # Список доступных пинов для удалённого доступа
    # Каждый пин: { gpioPin: номер, name: "имя", type: тип }
    # Типы: UNKNOWN=0, DIGITAL_READ=1, DIGITAL_WRITE=2
    # Пример (нельзя задать в YAML напрямую, используется CLI):
    #   meshtastic --set-remote-hardware-gpio 12 "Ворота" DIGITAL_WRITE
    # availablePins: []

  # ===========================================================================
  # NEIGHBOR INFO — ModuleConfig.NeighborInfoConfig
  # Модуль информации о соседних узлах (direct neighbors, 0-hop)
  # ===========================================================================
  neighbor_info:
    # Включить модуль Neighbor Info
    # Собирает инфо о напрямую слышимых соседях (SNR, RSSI, хопы)
    enabled: false

    # Интервал отправки информации о соседях (в секундах)
    # Минимум: 14400 (4 часа)! Дефолт: 14400
    # ⚠️ Слишком частая отправка перегружает эфир
    updateInterval: 14400

    # Передавать Neighbor Info через LoRa (не только MQTT/API)
    # true = отправлять в mesh-эфир
    # ⚠️ Не работает на канале с дефолтным ключом и именем!
    transmitOverLora: false

  # ===========================================================================
  # AMBIENT LIGHTING — ModuleConfig.AmbientLightingConfig
  # Управление RGB LED на плате (напр. RAK14001)
  # ===========================================================================
  ambient_lighting:
    # Включить LED
    ledState: false

    # Ток LED (единицы, дефолт 10)
    current: 10

    # Уровень красного (0-255)
    red: 0

    # Уровень зелёного (0-255)
    green: 0

    # Уровень синего (0-255)
    blue: 0

  # ===========================================================================
  # DETECTION SENSOR — ModuleConfig.DetectionSensorConfig
  # Модуль датчика событий (движение, открытие двери и т.д.)
  # ===========================================================================
  detection_sensor:
    # Включить модуль Detection Sensor
    # Мониторит GPIO-пин и отправляет сообщение при событии
    enabled: false

    # Минимальный интервал между сообщениями при детекции (в секундах)
    # Предотвращает флуд при частых срабатываниях
    minimumBroadcastSecs: 0

    # Интервал отправки текущего состояния (heartbeat, в секундах)
    # 0 = отправлять только при событии (ДЕФОЛТ)
    # N = отправлять статус каждые N секунд (покой = «не обнаружено»)
    stateBroadcastSecs: 0

    # Отправлять bell-символ (0x07) с сообщением о детекции
    # Для активации External Notification модуля
    sendBell: false

    # Дружественное имя датчика (max 20 символов)
    # Формат сообщения: "{name} detected"
    # Пример: name="Motion" → "Motion detected"
    name: ""

    # GPIO пин для мониторинга
    monitorPin: 0

    # Тип триггера (когда отправлять сообщение)
    #   LOGIC_LOW             = 0 — Когда пин LOW (0В) — ДЕФОЛТ
    #   LOGIC_HIGH            = 1 — Когда пин HIGH (VCC)
    #   FALLING_EDGE          = 2 — При переходе HIGH→LOW
    #   RISING_EDGE           = 3 — При переходе LOW→HIGH
    #   EITHER_EDGE_ACTIVE_LOW= 4 — При любом изменении, LOW = «активно»
    #   EITHER_EDGE_ACTIVE_HIGH=5 — При любом изменении, HIGH = «активно»
    detectionTriggerType: LOGIC_LOW

    # Использовать INPUT_PULLUP для GPIO пина
    # true = внутренний pull-up резистор (пин HIGH по умолчанию)
    # Только если плата поддерживает pull-up на этом пине
    usePullup: false

  # ===========================================================================
  # PAXCOUNTER — ModuleConfig.PaxcounterConfig
  # Модуль подсчёта людей (по WiFi/BLE probe-запросам)
  # ===========================================================================
  paxcounter:
    # Включить модуль Paxcounter
    # Подсчитывает кол-во WiFi/BLE устройств поблизости (оценка людей)
    enabled: false

    # Интервал отправки подсчёта в mesh (в секундах)
    paxcounterUpdateInterval: 0

    # WiFi RSSI порог (dBm) — устройства слабее не учитываются
    # Дефолт: -80
    wifiThreshold: -80

    # BLE RSSI порог (dBm)
    # Дефолт: -80
    bleThreshold: -80
